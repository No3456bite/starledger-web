<style id="rc114-rc56-layout-boundary-fix">
@media(max-width:760px){
  /*
   * #content is now ONLY the scroller/structural container.

  #content:not(.settings-page)>:not([hidden]) + :not([hidden]){
    margin-top:0!important;
    margin-bottom:0!important;
  }

  #content>#controlsFrame,
  #content>#pageBody{
    margin-top:0!important;
    margin-bottom:0!important;
  }

   * Old settings CSS turned the whole scroller into a grid.
   * Keep the scroller structurally identical on every page.
   */
  #content.settings-page{
    display:block!important;
    gap:0!important;
  }

  /*
   * Card/page spacing belongs here now.
   * Because pageBody is cloned intact by the transition, the exact same margins
   * exist before, during and after the horizontal animation.
   */
  #pageBody:not(.settings-page)>:not([hidden]) + :not([hidden]){
    margin-top:var(--card-gap)!important;
    margin-bottom:0!important;
  }
  #pageBody:not(.settings-page)>:first-child{
    margin-top:0!important;
    margin-bottom:0!important;
  }

  #pageBody.settings-page{
    display:grid!important;
    gap:var(--card-gap)!important;
  }
  #pageBody.settings-page>.section,
  #pageBody.settings-page>.card,
  #pageBody.settings-page>.grid{
    margin:0!important;
  }
  #pageBody.settings-page>.grid .section{
    margin:0!important;
  }

  /* Filters used to be direct children of #content before pageBody existed. */
  #pageBody>.filters,
  .search-page>.filters:nth-child(2){
    margin-inline:0!important;
    padding:0!important;
    border:0!important;
    border-radius:0!important;
    background:transparent!important;
    box-shadow:none!important;
    backdrop-filter:none!important;
    -webkit-backdrop-filter:none!important;
    gap:8px;
  }

  /*
   * The animation scene itself has no vertical layout compensation anymore:
   * its child pageBody owns exactly the same spacing as the live pageBody.

  .rc55-scroll-snapshot{
    margin:0!important;
    padding-top:0!important;
  }
}

/*
 * rc7.2.1 — canonical spindle line
 *
 * Both locations now use exactly one visual recipe.
 * Only geometry changes: length, position and horizontal/vertical orientation.
 *
 * The body is a 2D elliptical alpha field, so the line is naturally
 * thin at both ends and thickest in the middle. The transparency curve
 * is deliberately eased with uneven radial stops rather than a straight ramp.
 *
 * Glow comes from drop-shadow on the already-faded source pixels.
 * Therefore the glow follows the same 0→100→0 alpha and disappears with
 * the line at both ends instead of outlining a rounded cap.
 */
:root{
  --spindle-color:color-mix(in srgb,var(--up) 72%,var(--ink));
  --spindle-glow:color-mix(in srgb,var(--up) 46%,transparent);
  --spindle-glow-soft:color-mix(in srgb,var(--up) 24%,transparent);
  --spindle-paint:
    radial-gradient(
      ellipse at center,
      color-mix(in srgb,var(--spindle-color),transparent 0%) 0%,
      color-mix(in srgb,var(--spindle-color),transparent 1%) 9%,
      color-mix(in srgb,var(--spindle-color),transparent 4%) 18%,
      color-mix(in srgb,var(--spindle-color),transparent 12%) 30%,
      color-mix(in srgb,var(--spindle-color),transparent 28%) 44%,
      color-mix(in srgb,var(--spindle-color),transparent 50%) 59%,
      color-mix(in srgb,var(--spindle-color),transparent 72%) 73%,
      color-mix(in srgb,var(--spindle-color),transparent 89%) 86%,
      color-mix(in srgb,var(--spindle-color),transparent 97%) 94%,
      transparent 100%
    );
}

/* No separate halo layer anywhere. */
.year-flow-axis-track::before,
.row.month-break::before{
  content:none!important;
  display:none!important;
}

/* Shared appearance: identical in both locations. */
.year-flow-axis-track::after,
.row.month-break::after{
  content:""!important;
  position:absolute!important;
  pointer-events:none!important;
  border:0!important;
  border-radius:50%!important;
  background:var(--spindle-paint)!important;
  box-shadow:none!important;
  opacity:1!important;
  filter:
    drop-shadow(0 0 2px var(--spindle-glow))
    drop-shadow(0 0 5px var(--spindle-glow-soft))!important;
}

/* 年度 → 月度总览：只定义几何。 */
.year-flow-axis-track::after{
  left:var(--zero)!important;
  top:5px!important;
  bottom:5px!important;
  width:2.25px!important;
  height:auto!important;
  transform:translateX(-50%)!important;
}

/* 跨月账单分隔：只定义几何。 */
.row.month-break{
  position:relative!important;
  border-bottom-color:transparent!important;
}
.row.month-break::after{
  left:0!important;
  right:0!important;
  top:auto!important;
  bottom:-2px!important;
  width:auto!important;
  height:2.25px!important;
  transform:none!important;
}

/*
 * rc7.2.4 — month star glow
 *
 * No SVG and no concrete circular point.
 * Each positive-net month gets a CSS-only star-shaped glow at the
 * intersection with the yearly spindle. Brightness is fixed; only size changes.
 *
 * Size rule:
 *   round(month positive net / max positive net × 40pt)
 * with a minimum visible positive star of 4pt.
 */
.year-flow-star{
  position:absolute;
  z-index:4;
  top:50%;
  width:var(--star-size);
  height:var(--star-size);
  transform:translate(-50%,-50%);
  pointer-events:none;
  background:
    radial-gradient(ellipse 9% 52% at center,
      color-mix(in srgb,var(--up) 82%,transparent) 0%,
      color-mix(in srgb,var(--up) 62%,transparent) 20%,
      color-mix(in srgb,var(--up) 30%,transparent) 48%,
      transparent 78%),
    radial-gradient(ellipse 52% 9% at center,
      color-mix(in srgb,var(--up) 82%,transparent) 0%,
      color-mix(in srgb,var(--up) 62%,transparent) 20%,
      color-mix(in srgb,var(--up) 30%,transparent) 48%,
      transparent 78%),
    radial-gradient(circle at center,
      color-mix(in srgb,var(--up) 44%,transparent) 0%,
      color-mix(in srgb,var(--up) 18%,transparent) 24%,
      transparent 58%);
  filter:drop-shadow(0 0 2px color-mix(in srgb,var(--up) 34%,transparent));
}
.year-flow-star::before{
  content:"";
  position:absolute;
  inset:0;
  transform:rotate(45deg);
  background:
    radial-gradient(ellipse 7% 42% at center,
      color-mix(in srgb,var(--up) 48%,transparent) 0%,

  --sl-glass-top:rgba(255,255,255,.085);

  border-radius:25px!important;
  background:
    linear-gradient(180deg,
      color-mix(in srgb,var(--sl-glass-top) 56%,transparent) 0%,
      color-mix(in srgb,var(--sl-glass-top) 20%,transparent) 7%,
      transparent 19%,
      transparent 79%,
      color-mix(in srgb,var(--sl-glass-bottom) 30%,transparent) 92%,
      var(--sl-glass-bottom) 100%),
    var(--sl-glass-surface)!important;

  backdrop-filter:blur(7px) saturate(112%)!important;
  box-shadow:
    var(--sl-glass-shadow),
    inset 0 .45px 0 color-mix(in srgb,var(--sl-glass-top) 72%,transparent),
    inset 0 -.35px 0 color-mix(in srgb,var(--sl-glass-bottom) 68%,transparent)!important;
