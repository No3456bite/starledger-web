<style id="rc114-rc56-layout-boundary-fix">
@media(max-width:760px){
  /*
   * #content is now ONLY the scroller/structural container.
   * Its four structural children must never inherit the old card-gap system.
   */
  #content:not(.settings-page)>:not([hidden]) + :not([hidden]){
    margin-top:0!important;
    margin-bottom:0!important;
  }
  #content>#safeFrame,
  #content>#headerFrame,
  #content>#controlsFrame,
  #content>#pageBody{
    margin-top:0!important;
    margin-bottom:0!important;
  }

  /*
   * Old settings CSS turned the whole scroller into a grid.
   * Keep the scroller structurally identical on every page.
   */
  #content.settings-page{
    display:block!important;
    gap:0!important;
  }

  /*
   * Card/page spacing belongs here now.
   * Because pageBody is cloned intact by the transition, the exact same margins
   * exist before, during and after the horizontal animation.
   */
  #pageBody:not(.settings-page)>:not([hidden]) + :not([hidden]){
    margin-top:var(--card-gap)!important;
    margin-bottom:0!important;
  }
  #pageBody:not(.settings-page)>:first-child{
    margin-top:0!important;
    margin-bottom:0!important;
  }

  #pageBody.settings-page{
    display:grid!important;
    gap:var(--card-gap)!important;
  }
  #pageBody.settings-page>.section,
  #pageBody.settings-page>.card,
  #pageBody.settings-page>.grid{
    margin:0!important;
  }
  #pageBody.settings-page>.grid .section{
    margin:0!important;
  }

  /* Filters used to be direct children of #content before pageBody existed. */
  #pageBody>.filters,
  .search-page>.filters:nth-child(2){
    margin-inline:0!important;
    padding:0!important;
    border:0!important;
    border-radius:0!important;
    background:transparent!important;
    box-shadow:none!important;
    backdrop-filter:none!important;
    -webkit-backdrop-filter:none!important;
    gap:8px;
  }

  /*
   * The animation scene itself has no vertical layout compensation anymore:
   * its child pageBody owns exactly the same spacing as the live pageBody.
   */
  .rc55-scroll-snapshot{
    margin:0!important;
    padding-top:0!important;
  }
}
</style>
