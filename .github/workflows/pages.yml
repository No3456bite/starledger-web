name: Validate and deploy StarLedger

on:
  push:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check ui-runtime.js
          node --check books-stats.js
          node --check recognizer.js
          node --check sw.js
          node --check scripts/validate-build.mjs

      - name: Check build invariants
        run: node scripts/validate-build.mjs

  authorize-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Verify main commit came from a merged PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            > "$RUNNER_TEMP/associated-prs.json"

          node <<'NODE'
          const fs = require('fs');
          const path = process.env.RUNNER_TEMP + '/associated-prs.json';
          const prs = JSON.parse(fs.readFileSync(path, 'utf8'));
          const approved = prs.some(pr => pr.merged_at && pr.base?.ref === 'main');
          if (!approved) {
            console.error('Production deploy blocked: this main commit did not come from a merged PR.');
            process.exit(1);
          }
          console.log('Production deploy authorized: merged PR association verified by GitHub.');
          NODE

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - validate
      - authorize-production
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
