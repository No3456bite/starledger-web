name: Validate and deploy StarLedger

on:
  push:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check ui-runtime.js
          node --check books-stats.js
          node --check recognizer.js
          node --check history-predictor.js
          node --check sw.js
          node --check scripts/validate-build.mjs

      - name: Check build invariants
        run: node scripts/validate-build.mjs

      - name: Check Cloudflare Pages static bundle
        run: node scripts/build-site.mjs

      - name: Check active paper ledger and migration
        run: npm test

      - name: Check production migration in Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
          python3 -m http.server 4176 --directory dist > /tmp/starledger-http.log 2>&1 &
          export PLAYWRIGHT_MODULE=playwright
          export CHROMIUM_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")
          node paper-tests/migration-browser.cjs
          node paper-tests/complete-browser.cjs
          TEST_URL=http://127.0.0.1:4176 node paper-tests/motion-browser.cjs
          TEST_ENGINE=webkit TEST_URL=http://127.0.0.1:4176 node paper-tests/motion-browser.cjs
          TEST_URL=http://127.0.0.1:4176 node paper-tests/flat-browser.cjs
          TEST_ENGINE=webkit TEST_URL=http://127.0.0.1:4176 node paper-tests/flat-browser.cjs
          TEST_URL=http://127.0.0.1:4176 node paper-tests/back-navigation-browser.cjs
          TEST_ENGINE=webkit TEST_URL=http://127.0.0.1:4176 node paper-tests/back-navigation-browser.cjs
          TEST_URL=http://127.0.0.1:4176 node paper-tests/list-reports-browser.cjs
          TEST_ENGINE=webkit TEST_URL=http://127.0.0.1:4176 node paper-tests/list-reports-browser.cjs
          TEST_URL=http://127.0.0.1:4176 node paper-tests/ocr-handoff-browser.cjs
          TEST_ENGINE=webkit TEST_URL=http://127.0.0.1:4176 node paper-tests/ocr-handoff-browser.cjs

      - name: Check complete backup ZIP codec
        run: node scripts/test-backup-zip.cjs

      - name: Check backup content codes
        run: node scripts/test-content-hash.cjs

      - name: Check automatic backup decisions
        run: node scripts/test-auto-backup.cjs

      - name: Check OCR URL handoff
        run: node scripts/test-ocr-prefill.cjs

      - name: Check data safety and recovery
        run: node scripts/test-data-safety.cjs

      - name: Check duplicate ID review
        run: node scripts/test-duplicate-ids.cjs

      - name: Check budget impact rules
        run: node scripts/test-budget.cjs

      - name: Check OCR amount history matching
        run: node scripts/test-recognizer-history.cjs

      - name: Check entry flow and history suggestions
        run: |
          node scripts/test-entry-flow.cjs
          node scripts/test-history-predictor.cjs

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build production bundle
        run: node scripts/build-site.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  cloudflare-live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check Cloudflare Pages serves this app version
        run: |
          expected=$(grep -oE 'app\.js\?v=[A-Za-z0-9-]+' index.html | head -1)
          for attempt in {1..8}; do
            live=$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "https://starledger-web-dhp.pages.dev/?deploy_probe=${GITHUB_SHA}" || true)
            if [[ "$live" == *"$expected"* ]]; then
              echo "Cloudflare Pages serves $expected"
              exit 0
            fi
            echo "Cloudflare Pages does not yet serve $expected (attempt $attempt/8)"
            sleep 10
          done
          exit 1
