name: Temporary CORS probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cors-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Nutstore WebDAV CORS preflight
        shell: bash
        run: |
          set -x
          echo "=== OPTIONS preflight for PROPFIND + Authorization ==="
          curl -sS -D - -o /tmp/body.txt -X OPTIONS 'https://dav.jianguoyun.com/dav/' \
            -H 'Origin: https://no3456bite.github.io' \
            -H 'Access-Control-Request-Method: PROPFIND' \
            -H 'Access-Control-Request-Headers: authorization,content-type' || true
          echo "=== body ==="
          cat /tmp/body.txt || true
          echo
          echo "=== unauthenticated GET with Origin ==="
          curl -sS -D - -o /tmp/getbody.txt 'https://dav.jianguoyun.com/dav/' \
            -H 'Origin: https://no3456bite.github.io' || true
          echo "=== body ==="
          head -c 500 /tmp/getbody.txt || true
          echo
