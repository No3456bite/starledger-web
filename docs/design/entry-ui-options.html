<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>记一笔界面方案</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#f2f3f1;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.demo{width:390px;min-height:844px;margin:auto;padding:30px 16px 15px;background:#000}.sheet{display:flex;flex-direction:column;gap:13px;min-height:800px;padding:18px 15px 15px;border:1px solid #303330;border-radius:28px;background:#161817;box-shadow:0 20px 70px #0008}.header{display:flex;align-items:center;justify-content:space-between;min-height:32px}.header span{font-size:13px;color:#aaa}.header b{font-size:19px}.header button{border:0;background:transparent;color:#b8beb9;font-size:16px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;border-radius:16px;background:#252825}.tabs span{text-align:center;padding:11px 0;font-size:15px;color:#a0a7a2}.tabs .on{border-radius:12px;background:#353b37;color:#63ddb3;font-weight:700}.amount{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;padding:7px 5px 17px;border-bottom:1px solid #303330}.amount .cat{display:flex;gap:6px;align-self:flex-end}.amount .cat span{padding:7px 9px;border:1px solid #3b6656;border-radius:999px;color:#8bdfbf;font-size:13px}.amount strong{font-size:44px;line-height:1;letter-spacing:-1.5px}.amount small{margin-left:3px;color:#51c99a;font-size:21px}.suggest{display:flex;align-items:center;gap:7px;min-height:40px;white-space:nowrap}.suggest label{color:#a0a7a2;font-size:12px}.suggest span{padding:8px 9px;border:1px solid #3a3f3c;border-radius:10px;font-size:12px}.suggest em{color:#87caaa;font-size:10px;font-style:normal}.fields{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{min-height:49px;padding:8px 11px;border:1px solid #343835;border-radius:13px;color:#dce0dc;font-size:14px}.field small{display:block;margin-bottom:3px;color:#8e9891;font-size:10px}.note{min-height:67px;padding:13px;border:1px solid #343835;border-radius:14px;color:#b8c0ba;font-size:14px}.note small{display:block;margin-top:13px;color:#8e9891;font-size:11px;text-align:right}.space{flex:1}.keypad{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,53px);gap:7px}.keypad span{display:grid;place-items:center;border-radius:12px;background:#232723;font-size:25px}.keypad .operator{background:#27332d;color:#70d4ad}.keypad .delete{font-size:20px}.footer{display:grid;grid-template-columns:1fr 1.4fr;gap:9px}.footer span{display:grid;place-items:center;min-height:52px;border-radius:13px;background:#2b302c;font-size:16px;font-weight:700}.footer .primary{background:#22ad83;color:#fff}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions span{display:flex;align-items:center;justify-content:center;gap:7px;min-height:48px;border:1px solid #3d5148;border-radius:13px;background:#223029;color:#e9f8ee;font-size:15px;font-weight:700}.actions .secondary{background:#202422;border-color:#373c38}.hint{font-size:11px;color:#a0a7a2;line-height:1.4}.caption{padding:0 3px;color:#9aa19b;font-size:11px}.b .sheet{gap:10px}.b .amount{padding-bottom:12px}.b .note{min-height:64px}.b .keypad{grid-template-rows:repeat(4,61px)}.b .keypad .savekey{grid-column:4;grid-row:3 / 5;background:#22ad83;color:#fff;font-size:16px;font-weight:700;text-align:center}.b .keypad .operator{background:#26312b}.b .footer{display:none}.b .actions span{background:#2c332e}.b .hint{margin-top:0}.b .note small{margin-top:10px}
</style>
<body><div class="demo" id="demo"><div class="sheet"><div class="header"><button>×</button><b id="title">记一笔 <span>1 / 2</span></b><button>···</button></div><div class="tabs"><span class="on">支出</span><span>收入</span><span>转账</span><span>借贷</span></div><div class="amount"><div class="cat"><span>医疗⌄</span><span>医保⌄</span></div><div><strong>435.01</strong><small>¥</small></div></div><div class="suggest"><label>历史猜测</label><span>医疗 / 医保 <em>高</em></span><span>生活 / 药品 <em>中</em></span></div><div class="fields"><div class="field"><small>账户</small>医保卡⌄</div><div class="field"><small>账本</small>日常账本⌄</div></div><div class="note">备注 · 本月医保缴费<small>10 月 20 日 14:30　›</small></div><div class="actions"><span>＋ 下一笔</span><span class="secondary">◈ 关联账单 · 1</span></div><div class="hint">已关联的账单会加入本次任务；保存后一起生效。</div><div class="space"></div><div class="keypad"><span class="delete">⌫</span><span>7</span><span>8</span><span class="operator">÷</span><span>4</span><span>5</span><span>6</span><span class="operator">×</span><span>1</span><span>2</span><span>3</span><span class="operator">−</span><span>0</span><span>.</span><span class="operator">＋</span><span class="operator">=</span></div><div class="footer"><span>收起键盘</span><span class="primary">保存 2 笔</span></div><div class="caption" id="caption">方案 A · 底部保存始终突出，新增与关联在金额下方。</div></div></div><script>if(new URLSearchParams(location.search).get('option')==='b'){document.querySelector('.demo').classList.add('b');document.querySelector('.keypad').innerHTML='<span class="delete">⌫</span><span>7</span><span>8</span><span class="operator">÷</span><span>4</span><span>5</span><span>6</span><span class="operator">×</span><span>1</span><span>2</span><span>3</span><span class="savekey">保存<br>2 笔</span><span>0</span><span>.</span><span class="operator">=</span>';document.querySelector('#caption').textContent='方案 B · 保存作为键盘主键，新增与关联使用独立操作行。'}</script></body></html>
